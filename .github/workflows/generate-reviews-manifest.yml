name: Generate reviews manifest

on:
  push:
    paths:
      - 'media/resenas/**'
      - '!media/resenas/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-reviews-manifest.mjs
      - name: Commit updated manifest
        run: |
          if git diff --quiet -- media/resenas/manifest.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/resenas/manifest.json
          git commit -m 'chore: update reviews manifest'
          git push
